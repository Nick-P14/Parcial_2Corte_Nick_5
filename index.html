<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>CampusNet</title>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Registro de Estudiantes</h1>
        <div id="registrar" class="row g-4">

            <section id="seccionRegistrarse">
                <div class="container mt-3">
                    <h2>Registrarse</h2>
                    <form onsubmit="crearEstudiante(); return false;">
                        <div class="mb-3 mt-3">
                            <label for="documentoId">Documento de Identidad</label>
                            <input type="number" class="form-control" placeholder="Digite su identificación" id="documentoId">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="nombreId">Nombre Completo</label>
                            <input type="text" class="form-control" id="nombreId" placeholder="Digite su Nombre Completo">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="notaId">Nota Final</label>
                            <input type="number" step="0.1" min="0" max="5" class="form-control" id="notaId" placeholder="Digite la Nota Final">
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="programa">Elija su Programa</label>
                            <select class="form-select" id="programa">
                                <option value="Ingeniería">Ingeniería</option>
                                <option value="Ciencias">Ciencias</option>
                                <option value="Artes">Artes</option>
                                <option value="Negocios">Negocios</option>
                            </select>
                        </div>
                        <div class="mb-3 mt-3">
                            <label for="modalidadId">Elija su Modalidad</label>
                            <select class="form-select" id="modalidadId">
                                <option value="presencial">Presencial</option>
                                <option value="virtual">Virtual</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">Registrarse</button>
                    </form>
                </div>
            </section>

            <section id="seccionLista" class="mt-5">
                <h2>Listado de Estudiantes</h2>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Modalidad</th>
                            <th>Nota Final</th>
                            <th>Nota Definitiva</th>
                        </tr>
                    </thead>
                    <tbody id="tablaEstudiantesBody"></tbody>
                </table>
                <div class="alert alert-info">
                    Promedio General del Grupo: <span id="promedioGrupo">0</span>
                </div>
            </section>

        </div>
    </div>

    <script src="Modelo/Estudiante.js"></script>
    <script src="Modelo/Virtual.js"></script>
    <script src="Modelo/Presencial.js"></script>
    <script src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
