<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>CampusNet</title>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <span class="navbar-brand fw-bold fs-4">🎓 CampusNet</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">

            <section id="seccionRegistrarse" class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Registrar Estudiante</h5>
                        <button class="btn btn-sm btn-outline-light" onclick="toggleFormulario()">
                            <i class="bi bi-person-plus"></i> Mostrar / Ocultar
                        </button>
                    </div>
                    <div class="card-body">
                        <form id="formularioRegistro" onsubmit="crearEstudiante(); return false;" style="display:none;">
                            <div class="mb-3">
                                <label for="documentoId">Documento de Identidad</label>
                                <input type="number" class="form-control" placeholder="Digite su identificación" id="documentoId">
                            </div>
                            <div class="mb-3">
                                <label for="nombreId">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombreId" placeholder="Digite su Nombre Completo">
                            </div>
                            <div class="mb-3">
                                <label for="notaId">Nota Final</label>
                                <input type="number" step="0.1" min="0" max="5" class="form-control" id="notaId" placeholder="Digite la Nota Final">
                            </div>
                            <div class="mb-3">
                                <label for="programa">Programa</label>
                                <select class="form-select" id="programa">
                                    <option value="Ingeniería">Ingeniería</option>
                                    <option value="Ciencias">Ciencias</option>
                                    <option value="Artes">Artes</option>
                                    <option value="Negocios">Negocios</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="modalidadId">Modalidad</label>
                                <select class="form-select" id="modalidadId">
                                    <option value="presencial">Presencial</option>
                                    <option value="virtual">Virtual</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="bi bi-save"></i> Registrarse
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <section id="seccionLista" class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header">
                        <h5 class="mb-0">Listado de Estudiantes</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Modalidad</th>
                                    <th>Nota Final</th>
                                    <th>Nota Definitiva</th>
                                </tr>
                            </thead>
                            <tbody id="tablaEstudiantesBody"></tbody>
                        </table>
                        <div class="alert alert-info mb-0">
                            Promedio General del Grupo: <strong><span id="promedioGrupo">0</span></strong>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <script src="Modelo/Estudiante.js"></script>
    <script src="Modelo/Virtual.js"></script>
    <script src="Modelo/Presencial.js"></script>
    <script src="Controlador/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
